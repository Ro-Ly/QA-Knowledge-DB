name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      run_e2e: ${{ steps.set-output.outputs.run_e2e }}

    steps:
      - name: Set workflow outputs
        id: set-output
        run: |
          echo "run_e2e=${{ github.event.inputs.run_e2e }}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (GitHub Pages)
        working-directory: ./frontend
        run: npm run build:pages

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_e2e == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Start frontend preview
        working-directory: ./frontend
        run: |
          npm run preview -- --host 0.0.0.0 &

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:4173

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull E2E test image
        run: |
          docker pull ghcr.io/ro-ly/qa-knowledge-db-e2e:latest

      - name: Create Allure directories
        run: |
          mkdir -p allure-results
          mkdir -p allure-report

      - name: Run Playwright E2E tests
        run: |
          docker run \
            --network host \
            -e BASE_URL=http://127.0.0.1:4173 \
            -v ${{ github.workspace }}/allure-results:/app/target/allure-results \
            ghcr.io/ro-ly/qa-knowledge-db-e2e:latest

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Copy Allure report into frontend dist
        if: always()
        run: |
          mkdir -p frontend/dist/allure
          cp -R allure-report/* frontend/dist/allure/

      - name: Upload frontend artifact with Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-with-allure
          path: frontend/dist

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

  deploy:
    runs-on: ubuntu-latest

    needs:
      - build
      - e2e-tests

    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        needs.e2e-tests.result == 'success' ||
        needs.e2e-tests.result == 'skipped'
      )

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download frontend artifact with Allure
        if: needs.e2e-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-with-allure
          path: frontend/dist

      - name: Download frontend artifact
        if: needs.e2e-tests.result == 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4