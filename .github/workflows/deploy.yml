name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend (GitHub Pages)
        working-directory: ./frontend
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build

    if: github.event.inputs.run_e2e == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start frontend preview
        working-directory: ./frontend
        run: |
          npm run preview -- --host 0.0.0.0 &

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:4173

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull E2E test image
        run: |
          docker pull ghcr.io/ro-ly/qa-knowledge-db-e2e:latest

      - name: Run Playwright E2E tests
        run: |
          docker run \
            --network host \
            -e BASE_URL=http://127.0.0.1:4173 \
            ghcr.io/ro-ly/qa-knowledge-db-e2e:latest

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4